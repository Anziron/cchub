name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p cchub-protocol -p cchub-client -p hubd --all-targets --locked -- -D warnings
      - run: cargo test -p cchub-protocol -p cchub-client -p hubd --locked
      - run: bash scripts/check-budget.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hubd-linux-musl
          path: target/x86_64-unknown-linux-musl/release/hubd

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 检查前端类型和 Rust 一致
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/web/src/generated
        run: |
          cargo test -p cchub-protocol --features ts --locked export_bindings
          git status --porcelain web/src/generated
          git --no-pager diff web/src/generated
          test -z "$(git status --porcelain web/src/generated)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test -w web

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:web
      - run: cargo test -p cchub-protocol -p cchub-client --locked
      - run: cargo check -p hubd --locked
      - run: cargo clippy -p cchub-desktop --locked -- -D warnings
      - name: 编译可直接运行的桌面端
        run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cchub-windows
          path: target/release/cchub-desktop.exe

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装 NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - name: 编译 APK
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- android build --apk --ci --target aarch64 --target x86_64
      - name: 签名
        run: |
          # 没有固定密钥时（如外部 PR）用临时密钥，产物不能覆盖安装。
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            pass="$ANDROID_KEYSTORE_PASSWORD"
          else
            pass=temporary
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias cchub -keyalg RSA -keysize 2048 \
              -validity 1000 -storepass "$pass" -keypass "$pass" -dname "CN=cchub temporary"
          fi
          tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned=desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$pass" \
            --out cchub.apk "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: cchub-android
          path: cchub.apk
      - name: 编译测试用的 hubd
        run: |
          cargo build -p hubd --bins --locked
          pip install websockets
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器冒烟测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh cchub.apk target/debug/hubd target/debug/fake-claude testdata/recordings/approval/stream.jsonl android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: android-shots
          if-no-files-found: ignore
