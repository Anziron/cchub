name: CI

on:
  push:
    branches: [main]
    # 推 v* 标签时全部任务通过后发布 Release（见最后的 release 任务）。
    tags: ["v*"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p cchub-protocol -p cchub-client -p hubd --all-targets --locked -- -D warnings
      - run: cargo test -p cchub-protocol -p cchub-client -p hubd --locked
      - run: bash scripts/check-budget.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hubd-linux-musl
          path: target/x86_64-unknown-linux-musl/release/hubd

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 检查前端类型和 Rust 一致
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/web/src/generated
        run: |
          cargo test -p cchub-protocol --features ts --locked export_bindings
          git status --porcelain web/src/generated
          git --no-pager diff web/src/generated
          test -z "$(git status --porcelain web/src/generated)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test -w web

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:web
      - run: cargo test -p cchub-protocol -p cchub-client --locked
      - run: cargo check -p hubd --locked
      - run: cargo clippy -p cchub-desktop --locked -- -D warnings
      - name: 编译可直接运行的桌面端
        run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cchub-windows
          path: target/release/cchub-desktop.exe

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装 NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - name: 编译 APK
        run: |
          npm run tauri -- android init --ci
          # gen/ 不入库，init 出来的是 Tauri 默认图标 → 从 SVG 生成后覆盖；没覆盖上就失败，免得悄悄发出默认图标。
          res=desktop/gen/android/app/src/main/res
          npm run tauri -- icon desktop/icons/icon-manifest.json -o "$RUNNER_TEMP/icons"
          if [ -d "$RUNNER_TEMP/icons/android" ]; then cp -r "$RUNNER_TEMP/icons/android/." "$res/"; fi
          grep -q ic_launcher_monochrome "$res/mipmap-anydpi-v26/ic_launcher.xml"
          npm run tauri -- android build --apk --ci --target aarch64 --target x86_64
      - name: 签名
        run: |
          # 没有固定密钥时（如外部 PR）用临时密钥，产物不能覆盖安装。
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            pass="$ANDROID_KEYSTORE_PASSWORD"
          else
            pass=temporary
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias cchub -keyalg RSA -keysize 2048 \
              -validity 1000 -storepass "$pass" -keypass "$pass" -dname "CN=cchub temporary"
          fi
          tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned=desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$pass" \
            --out cchub.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs cchub.apk | grep -i 'SHA-256'
          # emoji2 的自动初始化必须已从合并后的清单里去掉（原因见 android-bridge 的 AndroidManifest.xml）。
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml cchub.apk > "$RUNNER_TEMP/manifest.txt"
          if grep -q EmojiCompatInitializer "$RUNNER_TEMP/manifest.txt"; then echo "EmojiCompatInitializer 还在清单里" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cchub-android
          path: cchub.apk
      - name: 编译测试用的 hubd
        run: |
          cargo build -p hubd --bins --locked
          pip install websockets pillow
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器冒烟测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # 不用 google_apis：模拟器开机后 GMS 常驻进程会重启，WebView 连着它的字体提供者，
          # 系统会把 cchub 一起杀掉（“重开后：进程不在了”的偶发失败）。cchub 不依赖 GMS。
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh cchub.apk target/debug/hubd target/debug/fake-claude testdata/recordings/approval/stream.jsonl android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: android-shots
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, types, web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/hubd-linux-musl/hubd dist/hubd-linux-x86_64
          cp artifacts/cchub-windows/cchub-desktop.exe dist/cchub-windows.exe
          cp artifacts/cchub-android/cchub.apk dist/cchub.apk
          cp tools/usage/cchub-usage.py scripts/install-server.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --notes-file - <<'EOF'
          服务器端（Linux x86_64，root）：

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-server.sh | bash -s -- --allow <你的 Tailscale 账号>
          ```

          桌面端下载 `cchub-windows.exe`，手机端下载 `cchub.apk`，首次打开时填服务器的 Tailscale 地址。详见 README 的“部署”。
          EOF
