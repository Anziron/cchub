[package]
name = "hubd"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cchub-protocol.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
inotify = "0.11"
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "time"] }
tokio-tungstenite = "0.27"
