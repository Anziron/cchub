# hubd 起子进程要想清楚：列表、状态检查很频繁，热路径上每起一个 systemctl 约 6ms CPU
# （会话是否运行因此改读 cgroup）。跑外部命令是本职的模块在开头写
# `#![allow(clippy::disallowed_methods)]` 并说明；ws.rs、session.rs、idle.rs、device.rs 这些热路径不许起。
disallowed-methods = [
    { path = "std::process::Command::new", reason = "hubd 的热路径不起子进程；跑外部命令放进 runner、host 这类模块（带超时、结束整个进程组）" },
    # 部署的是 musl 构建，它的标准库取不到创建时间（总是报 Unsupported），gnu 上的测试却照样通过。
    { path = "std::fs::Metadata::created", reason = "musl 构建里总是失败；要创建时间用 session::stat_log（statx）" },
]
