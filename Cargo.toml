[workspace]
resolver = "2"
members = ["protocol", "client", "server", "desktop", "desktop/android-bridge"]
default-members = ["protocol", "client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# 守内核的 lint 集中在这里，各成员写 `[lints] workspace = true`。
# 跨 await 持有同步锁会让单线程运行时的 hubd 整个卡住（clippy 默认只是警告）。
[workspace.lints.clippy]
await_holding_lock = "deny"

[workspace.dependencies]
cchub-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
