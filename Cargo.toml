[workspace]
resolver = "2"
members = ["protocol", "server", "desktop"]
default-members = ["protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
cchub-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
